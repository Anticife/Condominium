name: Deploy to Firebase on Merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            functions/package-lock.json
            web-app/package-lock.json

      - name: Compilar Frontend (web-app)
        env:
          VITE_FIREBASE_API_KEY: AIzaSyCgOVz0OTvKmv8ZdVS7XstuRZER1tI8tyI
          VITE_FIREBASE_AUTH_DOMAIN: condominium-f6236.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: condominium-f6236
          VITE_FIREBASE_STORAGE_BUCKET: condominium-f6236.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "452274246990"
          VITE_FIREBASE_APP_ID: "1:452274246990:web:83f234b2cde639ba413a1f"
          VITE_FIREBASE_MEASUREMENT_ID: G-LP5JYC0HZB
        run: |
          cd web-app
          npm ci
          npm run build

      - name: Compilar Backend (functions)
        run: |
          cd functions
          npm ci
          npm run build

      - name: Desplegar a Firebase (Hosting y Firestore)
        run: |
          npx --yes firebase-tools deploy --only hosting,firestore --token "${{ secrets.FIREBASE_TOKEN }}" --project condominium-f6236
