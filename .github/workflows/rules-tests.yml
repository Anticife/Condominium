name: Pruebas de firestore.rules y servicios

# Corre la suite completa (unitarias + emulador de Firestore) en cada pull
# request y a demanda. No bloquea el despliegue de main.
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json

      # El emulador de Firestore necesita Java 11+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rules
